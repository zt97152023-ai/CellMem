[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "axisprec"
version = "0.1.0"
description = "Auditable reference-based RNA-fraction deconvolution with selective presence calls"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "AxisPrec contributors"}]
requires-python = ">=3.11,<3.13"
dependencies = ["numpy==1.26.4", "scipy==1.13.1"]
keywords = ["bulk RNA-seq", "cell-type deconvolution", "selective prediction", "single-cell reference"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.optional-dependencies]
h5ad = ["anndata>=0.10.8,<0.12"]

[project.scripts]
axisprec = "axisprec.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
axisprec = ["frozen_rule.json"]
